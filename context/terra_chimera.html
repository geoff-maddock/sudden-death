<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terra Chimera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1b21;--panel:#14303a;--panel2:#1b3f4b;--line:#2c5b69;--ink:#e4f3ea;--dim:#8fb3ad;--mint:#7be0b0;--gold:#f2c14e;--coral:#ff7a6b;--violet:#b79cf5;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1b21;--panel:#14303a}}
:root[data-theme="dark"]{--bg:#0c1b21;--panel:#14303a}
:root[data-theme="light"]{--bg:#12262e;--panel:#183742}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'VT323','Courier New',monospace;font-size:19px;line-height:1.15;overflow:hidden}
h1,h2,h3,.hd{font-family:'Silkscreen','Courier New',monospace;font-weight:400;letter-spacing:.02em;margin:0}
#wrap{display:grid;grid-template-columns:1fr 310px;height:100%}
#view{position:relative;min-width:0;min-height:0;background:#050d10}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#side{background:var(--panel);border-left:3px solid var(--line);display:flex;flex-direction:column;min-height:0}
#hud{padding:10px 12px;border-bottom:2px solid var(--line)}
#hud .co{color:var(--gold);font-family:'Silkscreen',monospace;font-size:13px}
#hud .row{display:flex;justify-content:space-between;gap:8px}
.en{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{padding:0 6px;border-radius:9px;background:#0d242c;border:1px solid var(--line);font-size:17px;white-space:nowrap}
#team{padding:8px 10px;border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:5px;overflow:auto;max-height:42%}
.tm{display:flex;gap:8px;align-items:center;background:#0f2830;border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer}
.tm.bench{opacity:.65}
.tm canvas{width:40px;height:40px;image-rendering:pixelated;flex:none;border-radius:4px}
.tm .nm{display:flex;justify-content:space-between;gap:6px}
.bar{height:7px;background:#07161b;border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--mint)}
.bar.xp i{background:var(--violet)}
.bar.low i{background:var(--coral)}
#log{flex:1;overflow:auto;padding:8px 12px;font-size:18px;min-height:60px}
#log p{margin:0 0 3px}
#log p.g{color:var(--gold)} #log p.b{color:var(--coral)} #log p.m{color:var(--mint)} #log p.d{color:var(--dim)}
#btns{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-top:2px solid var(--line)}
button{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--mint)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
button.pri{background:#1f6b56;border-color:var(--mint)}
button.gold{background:#6b5313;border-color:var(--gold)}
button.on{border-color:var(--gold);color:var(--gold)}
input,textarea,select{font:inherit;color:var(--ink);background:#0a1d23;border:2px solid var(--line);border-radius:6px;padding:2px 8px}
#tip{position:fixed;z-index:40;display:none;pointer-events:none;max-width:320px;background:#0f2830;border:2px solid var(--gold);border-radius:8px;padding:6px 9px;font-size:17px;line-height:1.15;box-shadow:0 4px 0 #071318}
#tip .tt{color:var(--gold);font-family:'Silkscreen',monospace;font-size:12px}
[data-part],[data-mut]{cursor:help;text-decoration:underline dotted rgba(143,179,173,.5)}
.node[data-part],.node[data-mut]{text-decoration:none}
#modal{position:fixed;inset:0;background:rgba(3,10,13,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.show{display:flex}
#box{background:var(--panel);border:3px solid var(--line);border-radius:10px;max-width:980px;width:100%;max-height:100%;overflow:auto;padding:16px 18px;box-shadow:0 0 0 3px #071318}
#box.wide{max-width:1180px}
#box h2{font-size:20px;color:var(--gold);margin-bottom:8px}
#box h3{font-size:14px;color:var(--mint);margin:10px 0 4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.card{background:#0f2830;border:2px solid var(--line);border-radius:8px;padding:8px 10px}
.card.sel{border-color:var(--gold)}
.card.pick{cursor:pointer}
.card.pick:hover{border-color:var(--mint)}
.port{image-rendering:pixelated;background:radial-gradient(circle at 50% 60%,#25525f,#0d242c);border-radius:8px;border:2px solid var(--line)}
.dim{color:var(--dim)} .gold{color:var(--gold)} .mint{color:var(--mint)} .bad{color:var(--coral)}
.kw{color:var(--gold);cursor:pointer;text-decoration:underline dotted}
.talk{display:flex;gap:14px}
.talk canvas{width:96px;height:96px;flex:none}
.say{min-height:110px;font-size:21px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
table{border-collapse:collapse;width:100%} td,th{padding:1px 6px;text-align:left;vertical-align:top}
#tree{position:relative;height:330px;background:#0b2128;border:2px solid var(--line);border-radius:8px;overflow:hidden}
#tree svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:128px;margin-left:-64px;text-align:center;background:#123440;border:2px solid var(--line);border-radius:8px;padding:2px 4px;cursor:pointer;font-size:17px;line-height:1}
.node.done{border-color:var(--mint);background:#15463f}
.node.open{border-color:var(--gold)}
.node.lock{opacity:.45}
.node.cur{box-shadow:0 0 0 3px var(--gold)}
#wall{width:100%;height:auto;image-rendering:pixelated;border-radius:8px;border:3px solid #4a3a1a;display:block}
#title{text-align:center}
#title h1{font-size:44px;color:var(--mint);text-shadow:3px 3px 0 #0a3a30,6px 6px 0 #061a1f;margin:6px 0 2px}
#title .sub{color:var(--gold);margin-bottom:12px}
textarea.json{width:100%;height:46vh;font-family:'Courier New',monospace;font-size:13px;line-height:1.25;white-space:pre}
#pad{display:none;position:absolute;left:10px;bottom:10px;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;opacity:.8}
#pad button{padding:0;font-size:22px}
#pad2{display:none;position:absolute;right:10px;bottom:10px;gap:6px;opacity:.85}
@media (pointer:coarse){#pad{display:grid}#pad2{display:flex}}
@media (max-width:760px){#wrap{grid-template-columns:1fr;grid-template-rows:56% 44%}#side{border-left:0;border-top:3px solid var(--line)}#team{max-height:40%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>
<div id="modal"><div id="box"></div></div>
<div id="tip" role="tooltip"></div>

DB.chars={
 clerk:{name:'Imelda Foss',look:{coat:'#3f5a7a',acc:'clip',hair:'#8a857e'},greet:'League office. Take a number. You are the only one here, so your number is one.',topics:{
  job:{t:'I am the League clerk. I issue every LICENCE, record every CUP, and tell every handler the same thing about the CHAMPIONSHIP.'},
  licence:{t:'Here. One handler licence, five snares, no refunds. Your CREW is waiting on you: Pell in the workshop, Tansy in the canteen, Quill in the chapel. Go and collect them before you go anywhere.',set:'licensed',give:{snare:5},once:'got_licence',xp:15,t2:'You have your licence. Do not lose it. People lose them.'},
  cup:{t:'Four regional cups: Mosswold south-west, Brinefen south-east, Cindermaw north-east, Frostspire north-west. Any order. The field is scaled to your record, so the fourth is the hard one whichever it is.',xp:10},
  championship:{t:'Held once a year at the Crown Coliseum, in the last week of the year. Four cups gets you in. Miss the week and you wait for the next one, and Apex Biologic keeps the crown another year.',xp:10},
  crew:{t:'A handler alone is a person with a net. Your geneticist splices, your enchanter binds energy, your cook feeds. Use all three or lose to somebody who did.'},
  bracket:{t:'The First Bracket! We thought it burned with the old hall. Vesper had it all along, the old thief. Here: a finder\'s fee, and the League\'s thanks, which is worth less.',take:{oldbracket:1},gold:120,giveRp:15,once:'q_bracket',xp:20,t2:'It hangs in the office now. Do not touch it.',needNo:'The First Bracket? If it still exists it would be with Vesper\'s things. Ask around the fountain.'},
  letter:{t:'From Pim? Give it here. ... Yes. Yes, fine, the post can run. Take him my reply.',take:{letter:1},give:{reply:1},once:'q_letter2',xp:10,t2:'I have replied. Get it to him.',needNo:'I have no letter from you.'}}},
 pell:{name:'Dr. Odalys Pell',look:{coat:'#2f7a6a',acc:'labcoat',hair:'#2a1a12',skin:'#c99a70'},greet:'Do not touch the jar.',topics:{
  job:{t:'Geneticist. I take PARTS off one chimera and put them on another, and I run the RESEARCH that grows new ones. If you have a licence I will JOIN you; the company is paying me either way.'},
  parts:{t:'Five sites: head, body, limbs, back, tail. Every site is always occupied, so an upgrade replaces what was there. Anything I take off goes in the parts bin and can go onto any chimera you like. That is rather the point of the word chimera.',xp:10},
  research:{t:'Every species has its own tree. Battles and discoveries earn data. Spend data to work out a graft, then pay for the materials and I will fit it. You will see the difference. So will the other team.',xp:10},
  join:{t:'Fine. I will bring the portable bench. Press C for camp whenever you want me.',need:'licensed',needNo:'Get your licence from Foss first. I am not being arrested again.',set:'crew_gen',xp:20,once:'j_gen',t2:'I am already packed.'}}},
 tansy:{name:'Marrow Tansy',look:{coat:'#a0522d',acc:'apron',hair:'#b0485a'},greet:'Sit down, you look underfed. So do your animals.',topics:{
  job:{t:'Cook. A chimera is what it eats. Bring me FORAGE from the bushes out there and I will make meals that change them for good. Say JOIN and I will fetch my pots.'},
  forage:{t:'Every region has its own bush: mossberry, ember pepper, brine kelp, frost mint, and aethercap here on the plains. Bushes grow back in a few days. A chimera can only stomach one lasting meal per level, so spend them well.',xp:10},
  join:{t:'Right. Somebody carry the big pot.',need:'licensed',needNo:'Licence first, love. Foss, across the square.',set:'crew_cook',xp:20,once:'j_cook',t2:'I am coming, I am coming.'}}},
 quill:{name:'Brother Quill',look:{coat:'#5a3d8a',acc:'robe',hair:'#e8e0f0'},greet:'Peace. Mind the circle, it is still wet.',topics:{
  job:{t:'Enchanter. The land has ENERGY in it, a different kind in every biome. I bind it into living things. If you will have me, I will JOIN.'},
  energy:{t:'Draw it from the WELLS, the standing crystals. Ember sharpens, Tide fortifies, Bloom toughens, Rime quickens, Aether does a little of everything. Wells refill overnight. Wild chimeras shed a little too.',xp:10},
  wells:{t:'Three to a region, more or less. The old vaults have their own. I can also re-attune a chimera to a different element entirely, though it costs five.'},
  join:{t:'Then I will walk with you.',need:'licensed',needNo:'The League likes its paperwork before its miracles. See Foss.',set:'crew_ench',xp:20,once:'j_ench',t2:'I am with you already.'}}},
 hq_shop:shopTalk('Merrit Odd',{coat:'#7a5a32',acc:'cap'},'hq','Odd Lots. If I have not got it, you do not need it.'),
 hq_inn:innTalk('Dolores Hen',{coat:'#b0485a',acc:'apron',hair:'#f2c14e'},15,'Beds upstairs, stables out back, no chimeras on the furniture.'),
 rival:{name:'@rival0',look:'@rival0',greet:'Oh. Another company in the running. How nice for the bracket.',topics:{job:{t:'Handler, same as you, but better funded. I will see you in the second round of some CUP or other.'},cup:{t:'Every cup puts a rival company in round two. We do not throw matches. We have shareholders.'}}},
 vesper:{name:'Gant Vesper',look:{coat:'#6b5313',acc:'scarf',hair:'#c9c9c9',tall:1},greet:'That wall used to have my name on it. Twice.',topics:{
  job:{t:'Retired. I won the CHAMPIONSHIP before Apex bought the league a new roof. Now I stand by the WALL and give advice nobody asked for.'},
  wall:{t:'Every cup you win goes up there, and the bracket fills in toward the crown. Look at it whenever you like. It is good for morale and bad for humility.',act:'wall'},
  championship:{t:'Vance fields a Slagback that does not fall over. Bring Tide for it. Bring something that heals. And bring parts that are not in any catalogue, the kind you only find in the VAULT and the deep places.',xp:15},
  vault:{t:'The Gene Vault, south-east of town. Pre-League. I kept a keycard from my last trip down. Here. There is a halo in the bottom of it that I never could reach.',need:'cups2',needNo:'Win two cups and I will believe you would survive it. Then ask me again.',give:{keycard:1},once:'got_keycard',xp:25,t2:'You have the card. The warden down there is called Specimen Nought. It is called that for a reason.'}}},
 moss_reg:regTalk('Tally Brann',{coat:'#3a7f45',acc:'clip'},'moss','Mosswold Arena. Wipe your feet, the sand is new.'),
 moss_shop:shopTalk('Fenn Greengage',{coat:'#5dbb63',acc:'basket'},'moss','Berries are fresh. Snares are not, but they work.'),
 moss_inn:innTalk('Ma Hollow',{coat:'#7a5a32',acc:'apron'},12,'The Hollow Log. It is an actual log. Mind your head.'),
 wenna:{name:'Old Wenna',look:{coat:'#4a6a4a',acc:'basket',hair:'#e8e0f0'},greet:'Shut the door, you are letting the damp out.',topics:{job:{t:'Forager, sixty years. I know every bush and every NEST between here and the fen.'},nest:{t:'Wild nests give an egg if you are quiet about it, and they fill again in a few days. But the ELDER keeps the best one.',xp:10},elder:{t:'West of here, near the coast, there is a grove with bone totems round a great nest. The Elder of the Grove wears antlers no catalogue sells. Beat it and they are yours to graft.',xp:15},
  berries:{t:'Three mossberries for the winter jam and I will tell your enchanter where the good sap runs. Here: bloom energy, bottled.',take:{mossberry:3},giveEn:{bloom:6},once:'q_wenna',xp:15,t2:'The jam set nicely.',needNo:'Three mossberries. The bushes are not far.'}}},
 moss_kid:{name:'Button',look:{coat:'#e0457b',hair:'#f2c14e'},greet:'Is that a real one? Can I hold it? Does it bite?',topics:{job:{t:'I am nine. My job is looking for GLOOMCAPS.'},gloomcaps:{t:'They live in the woods and the fen. They are slow so you can catch them easy, but their spores make your chimeras sick for ages. My mum says they win by waiting. If you ever catch one, SHOW me.',xp:10},show:{t:'A real one! Here, I saved up. Take it. Buy it a hat.',needSp:'gloomcap',needNo:'You have not got one. Go and catch one in the woods. They are slow.',give:{mutagen:1},giveRp:12,once:'q_button',xp:20,t2:'I still think about it.'}}},
 salt_reg:regTalk('Osric Tide',{coat:'#235c9c',acc:'clip'},'salt','Brinefen Arena. The floor drains toward the middle. Do not ask why.'),
 salt_shop:shopTalk('Pella Marsh',{coat:'#4f9fe0',acc:'cap'},'salt','Kelp, salt, rope, nets. Cheapest snares on the map.'),
 salt_inn:innTalk('Cob Drysock',{coat:'#7a5a32',acc:'apron'},12,'The Dry Sock. The name is an aspiration.'),
 diver:{name:'Ysolde Wrack',look:{coat:'#2f8f96',acc:'goggles',hair:'#1a1210'},greet:'You will excuse the drip.',topics:{job:{t:'Salvage diver. I work the HATCHERY when the tide lets me.'},hatchery:{t:'South-west of town on the shore, a drowned League-before-the-League building. GLIMMERFIN breed down there and nowhere else worth the name. The Hatch-Mother sits on a pearl crest I would very much like and cannot lift.',xp:15},glimmerfin:{t:'Tide-blooded but they throw Aether light. Fast, fragile, long reach. Their tree ends in a body graft, which is rare.'},
  kelp:{t:'Bring me three brine kelp for my joints and I will give you something I fished out of the vault run-off. A mutagen vial, still sealed.',take:{brinekelp:3},give:{mutagen:1},once:'q_kelp',xp:20,t2:'My knees thank you.',needNo:'Three brine kelp. The bushes on the fen have it, or Pella sells it.'}}},
 netter:{name:'Hob Tarn',look:{coat:'#5a6e3a',acc:'net'},greet:'Throw from the hip, not the shoulder.',topics:{job:{t:'Net-maker. Every SNARE in the south is mine.'},snare:{t:'A snare holds best on a chimera that is nearly beaten. Full health, you are wasting rope. Down in the red, it is nearly certain. You need to be within three paces to throw. Catch me three different KINDS and I will show you the good rope.',xp:10},
  kinds:{t:'Three kinds. That is a handler. Take these, chain-weighted.',needCaught:3,needNo:'Not three kinds yet. Wild ones, snared, not hatched.',give:{snare:5},giveRp:8,once:'q_hob',xp:15,t2:'Throw from the hip.'}}},
 cind_reg:regTalk('Marta Klinker',{coat:'#a83a1e',acc:'clip'},'cind','Cindermaw Arena. The floor is warm. That is normal.'),
 cind_shop:shopTalk('Dunstan Coke',{coat:'#6a5a58',acc:'cap'},'cind','Peppers, salves, and one shelf I do not ask questions about.'),
 cind_inn:innTalk('Ember Annie',{coat:'#f0803c',acc:'apron'},14,'The Banked Fire. Nobody has ever complained of the cold.'),
 smith:{name:'Tull Brandt the Younger',look:{coat:'#3a2e2c',acc:'helmet',skin:'#9a6a48'},greet:'Father is at the arena. I am the one who does the work.',topics:{job:{t:'Smith. I shoe Slagbacks, which is as stupid as it sounds. They come up out of the WARREN.'},warren:{t:'Emberdeep, east along the lava. The Warren Queen nests at the bottom round a lump of living rock we call the Magma Heart. It is a body graft. Whatever wears it hits like a furnace door.',xp:15},
  peppers:{t:'Two ember peppers for the forge stew and I will make you three snares out of chain.',take:{emberpepper:2},give:{snare:3},once:'q_pepper',xp:15,t2:'Good stew, that was.',needNo:'Two ember peppers. Off the scrub bushes, or from Coke.'}}},
 scout:{name:'Ash Peregrine',look:{coat:'#5e5551',acc:'hat'},greet:'Watch the crust. If it is orange, do not step on it.',topics:{job:{t:'League scout. I map the WELLS and keep the roads off the lava.'},wells:{t:'Ember wells here, three of them, all within a morning of the road. Ember energy is attack, plain and simple. Your enchanter will know what to do with it.',xp:10},
  survey:{t:'Nobody has mapped the Warren in a decade. Come back when you have been down and I will pay League survey rates.',need:'seen_emberdeep',needNo:'You have not been down yet. East along the lava.',gold:120,giveRp:10,once:'q_survey',xp:15,t2:'The map is filed. Thank you.'}}},
 rime_reg:regTalk('Sigrun Vane',{coat:'#6aa6c4',acc:'clip'},'rime','Frostspire Arena. Breath freezes; do not let it distract you.'),
 rime_shop:shopTalk('Old Kettil',{coat:'#8ab8d0',acc:'hat'},'rime','Mint, salves, purge tonic. Everything keeps up here.'),
 rime_inn:innTalk('Bera Lastlamp',{coat:'#b38cf0',acc:'scarf'},14,'The Last Lamp. After us it is just snow.'),
 monk:{name:'Sister Ilka',look:{coat:'#bfe6f2',acc:'robe'},greet:'You have walked a long way to be cold.',topics:{job:{t:'I keep the abbey wells. Rime ENERGY is the quick kind.'},energy:{t:'Bind Rime for speed. Speed decides who moves first, and who moves first usually decides the rest. But an enchanter can only bind so much into one creature: a couple of bindings, and one more every third level.',xp:10},
  mint:{t:'Two frost mint for the abbey tea and the wells are yours to draw from. Take this, drawn already.',take:{frostmint:2},giveEn:{rime:6},once:'q_ilka',xp:15,t2:'The tea was good.',needNo:'Two frost mint. Kettil sells it, or the pinewood bushes.'}}},
 watcher:{name:'Jory Farsight',look:{coat:'#33354a',acc:'goggles'},greet:'Green lights last night. She is nesting again.',topics:{job:{t:'I watch the sky and the ROOST.'},roost:{t:'The Aurora Roost, far up the north coast, east of here. The Matriarch there trails a tail of light. Splice that onto anything and it will lash frost three tiles out. Bring word when she is beaten and I can finally close the LOG.',xp:15},
  log:{t:'Then the sky is quiet. Twelve years of watching. Take the purge tonic; I kept it for the day.',need:'alpha_aurora',needNo:'She is still up there. I would know.',give:{purge:2},giveRp:15,once:'q_jory',xp:20,t2:'The log is closed.'}}},
 almond:{name:'Prue Almond',look:{coat:'#8a6a3c',acc:'clip',hair:'#e8e0f0'},greet:'Ah. A new face for the BESTIARY.',topics:{job:{t:'I keep the League Bestiary: every kind of chimera anyone has ever snared, drawn in my own hand. It is not finished. It will never be finished. Snare five KINDS and I will add your name to the frontispiece.'},bestiary:{t:'Eight species, that we know of. The vaults have more, or had. Somebody will find them, and I hope it is somebody who can hold a pencil.',xp:10},kinds:{t:'Five! Let me see them. Yes. Yes. Oh, that one is ugly. Take these rations, I never use them, and here is what the League pays a contributor.',needCaught:5,needNo:'Not five yet. Come back when you have them; I am not going anywhere, I have not gone anywhere since the roof.',give:{ration:5},gold:60,giveRp:12,once:'q_almond',xp:20,t2:'Your name is in the frontispiece. Second column, small print.'}}},
 tallow:{name:'Fenwick Tallow',look:{coat:'#f2c14e',acc:'cap',hair:'#7a4a20'},greet:'Mind the wax. Mind the wick. Mind your feet.',topics:{job:{t:'Lamplighter. Every aether lamp in town is mine to light, and they do not light themselves, whatever people say. They light on AETHERCAP oil.'},aethercap:{t:'Purple caps from the plains. Two of them and I can run the lamps a week, and I will pour you off the energy I do not need.',take:{aethercap:2},giveEn:{aether:5},once:'q_tallow',xp:15,t2:'The lamps are bright this week. Thank you.',needNo:'Two aethercaps. The plains are full of them, and Merrit sells them when he has them.'}}},
 rowe:{name:'Dusty Rowe',look:{coat:'#5e5551',acc:'scarf',hair:'#8a857e'},greet:'Buy me a drink and I will tell you how I lost.',topics:{job:{t:'Handler. Was. I took a team to the crown three years running and Vance beat me three years running. Now I stand by the fountain and tell people about APEX, and about Vesper\'s COTTAGE if they ask nicely.'},apex:{t:'She does not cheat. That is the worst of it. She has a Slagback with a Magma Heart and a Glimmerfin that heals faster than you can hurt it. Bring three chimeras that can each kill one of hers and pray about the order.',xp:15},cottage:{t:'Vesper\'s old place? Out west of town, off the fountain road, past the bushes. He shut it up when he moved to the fountain. Never sold it; never cleared it. There is a board in there Foss would give her clip for.',set:'clue_cottage',xp:10},lost:{t:'The first year I brought all Ember. The second year I brought a healer. The third year I brought everything I had and it was not enough. It is not a fair fight. It is not meant to be.'}}},
 brack:{name:'Gaffer Brack',look:{coat:'#a08a55',acc:'hat',hair:'#e8e0f0'},greet:'Do not swat. They can smell fear and they think it is funny.',topics:{job:{t:'Beekeeper. The Mosswold bees are the size of thumbs and gentle as lambs unless you are a Gloomcap. I trade HONEY, of a sort.'},honey:{t:'Two sacks of grain for the hives and I will fill your basket with mossberries from my own bank. Better than the grocer sells, and I will not tell him you said so.',take:{grain:2},give:{mossberry:4},giveRp:4,once:'q_brack',xp:10,t2:'Come back next season and we will do it again. Not before. The bees would notice.',needNo:'Two sacks of grain. Fenn has it, or Merrit in Graftonbury.'},bees:{t:'They pollinate the mossberry, they keep the Gloomcaps off the road, and once a year they swarm the arena. The registrar stops the match. It is in the rules now.'}}},
 fern:{name:'Sister Fern',look:{coat:'#2f7a3d',acc:'robe',hair:'#3a2c1a',skin:'#9a6a48'},greet:'The totem is not for luck. It is for remembering.',topics:{job:{t:'I keep the TOTEM and the old stories, and I know the way to the old SHRINE. Nobody pays me. The wood does.'},totem:{t:'Before the League, the Elder of the Grove came to Mossgate every spring and the town fed it. Then the League fenced the arena and the Elder stopped coming. The totem is a promise to keep feeding it anyway, in case it changes its mind.',xp:10},elder:{t:'If you go to the grove, go hungry. It respects that. And leave a mossberry on the totem on your way out, whether you win or not.',xp:5},shrine:{t:'There is an older shrine than mine: three totems in the deep wood, south of town on the coast side, and a hermit who keeps them. Follow the bees; they know the way.',set:'clue_shrine',xp:10}}},
 marrowbone:{name:'Captain Lull Marrowbone',look:{coat:'#235c9c',acc:'hat',hair:'#e8e0f0',skin:'#c99a70'},greet:'She still floats. That is more than I can say.',topics:{job:{t:'Ferry captain, retired, unwilling. Fifty years across the fen, most of it on the MARIGOLD. I would give my good leg to see a GLIMMERFIN again.'},glimmerfin:{t:'They used to follow the ferry, bending the light under the bow. Then the hatchery flooded and they stopped. Show me one. Just show me.',needSp:'glimmerfin',needNo:'You have not got one. They are down the Drowned Hatchery, south-west of here, if they are anywhere.',give:{salve:2},giveRp:15,once:'q_marrowbone',xp:20,t2:'It bent the light. I saw it bend the light. Thank you.'},ferry:{t:'The ferry does not run. The League built roads and the roads do not sink, which is a low bar but there it is.'},marigold:{t:'My ship. The Marigold. Went over in the big blow, east of here on the outer sands. She is still there, keel up. My LOG is in her, if the gulls have not eaten it.',set:'clue_marigold',xp:10},log:{t:'The log. Fifty years. Give it here. ... Yes. That is my hand. Thank you, handler. Take this; it is what the League paid me for the wreck and I never wanted it.',take:{shiplog:1},gold:100,giveRp:10,once:'q_shiplog',xp:20,t2:'I read it every night now.',needNo:'The log is in the Marigold, on the outer sands east of town. Ask me about the MARIGOLD.'}}},
 anck:{name:'Widow Anck',look:{coat:'#33354a',acc:'scarf',hair:'#8a857e'},greet:'The light is out. I know. Everybody tells me.',topics:{job:{t:'I keep the lighthouse, or I did until the HATCHMOTHER took the lamp room for a nest. I keep the stairs now.'},hatchmother:{t:'A Glimmerfin the size of a boat, grown fat on the light. Beat her, and I can climb back up and light the lamp, and the fen will give up what it has been hoarding.',need:'alpha_hatchmother',needNo:'She is still up there. I can hear her from the stairs.',giveEn:{tide:6},giveRp:10,once:'q_anck',xp:20,t2:'The lamp is lit. Look south tonight; you will see it.'},lighthouse:{t:'Forty years of lighting it. My husband built the stairs. Every one of them is a different height, and I could climb them blind.'}}},
 grit:{name:'Grit Halloway',look:{coat:'#4a423f',acc:'helmet',hair:'#1a1210',skin:'#9a6a48'},greet:'Cough. Sorry. Cinder lung. Cough.',topics:{job:{t:'Miner. Basalt, mostly, and the glass that sets in the lava cracks. The cough is the price. There is a REMEDY, if you have the makings.'},remedy:{t:'One ember pepper and two twists of salt, steeped. It does nothing for the lung but it does wonders for the mood. Here: I found this in the deep seam and I do not trust it.',take:{emberpepper:1,salt:2},give:{mutagen:1},once:'q_grit',xp:15,t2:'Breathing easier. Well. Complaining easier.',needNo:'One ember pepper, two salt. The scrub bushes and the chandler, respectively.'},seam:{t:'The Deep Seam. North-east of town, past the last lava tongue, a shaft the League sealed and the miners unsealed. There is a wyrm at the bottom sitting on a heart of GLASS that beats. I want it. I do not want to get it.',set:'clue_deepseam',xp:10},glass:{t:'The Glass Heart. It IS beating. Take the fee, take the ember, and never tell me what was in there with it.',take:{glassheart:1},gold:150,giveEn:{ember:6},giveRp:12,once:'q_glass',xp:25,t2:'I keep it in a box. The box hums.',needNo:'The heart is at the bottom of the Deep SEAM. Ask me about it.'}}},
 pyre:{name:'Pyre Vasquez',look:{coat:'#a83a1e',acc:'goggles',hair:'#1a1210',skin:'#c99a70'},greet:'You have the look of somebody who has never been set on fire.',topics:{job:{t:'Pit fighter, before the League banned the pits. Now I train handlers who want their chimeras to hit harder. My PRICE is proof you can catch, not just buy.'},price:{t:'Four kinds snared. Not hatched, not bought. Snared, by you. Then I will pour you the ember I keep for people who have earned it.',needCaught:4,needNo:'Four kinds. Snared. I can tell the difference, and so can they.',giveEn:{ember:7},giveRp:8,once:'q_pyre',xp:20,t2:'Hit them first. Hit them hardest. The rest is paperwork.'},pits:{t:'The pits were honest. The arena is fair. Those are not the same thing, and Vance knows it.'}}},
 halvard:{name:'Brother Halvard',look:{coat:'#6aa6c4',acc:'robe',hair:'#e8e0f0'},greet:'You are early. Or the bell is late. It is usually the bell.',topics:{job:{t:'Bellringer. The abbey bell keeps the town on time and the Frostlets off the roofs. It is cast from the same alloy as the WELLS, and it needs feeding.'},wells:{t:'A pinch of frost mint and a handful of grain, burnt under the bell once a month, and it rings true. The abbey pays for the makings. Bring them and the fee is yours.',take:{frostmint:1,grain:1},gold:60,giveRp:6,once:'q_halvard',xp:15,t2:'The bell rang true this morning. Did you hear it?',needNo:'One frost mint, one sack of grain. Kettil has both.'},bell:{t:'The Matriarch at the Roost hates the bell. Some say the bell was cast to keep her away. Some say it was cast to call her. The abbey does not say. Our bell is the second; the first hangs in the old CHAPEL still.'},chapel:{t:'The Frozen Chapel, west of town in the pines, where the abbey stood before the snow line moved. The first bell is still hung. Its CLAPPER would be worth a great deal to us.',set:'clue_chapel',xp:10},clapper:{t:'The first tongue! Feel the weight of it. The abbot will weep. Take this from the bell fund, and this, drawn from the wells this morning.',take:{bellclapper:1},gold:120,giveEn:{rime:8},giveRp:12,once:'q_clapper',xp:25,t2:'It rang at dawn. Did you hear? The whole town heard.',needNo:'The clapper hangs in the old CHAPEL, west in the pines. Ask me.'}}},
 ingrith:{name:'Ingrith Skarr',look:{coat:'#bfe6f2',acc:'goggles',hair:'#f2c14e'},greet:'Do not touch the map. The ink is frozen and it will crack.',topics:{job:{t:'Cartographer. The League pays me by the mile and the Frostspire does not have many miles worth paying for. Except the ROOST.'},roost:{t:'Nobody has surveyed the Aurora Roost and lived to draw it. Go there, come back, and describe it to me. I will pay survey rates and feed you for the trouble.',need:'seen_auroraroost',needNo:'You have not been. I would know; people who have been walk differently.',gold:90,give:{ration:3},giveRp:20,once:'q_ingrith',xp:20,t2:'It is on the map now. Your name is in the corner, very small.'},map:{t:'Five regions, four cups, three vaults, two lairs, one crown. And one road that does not go anywhere, north of the Roost. I drew it. I still do not know why.'}}},
 nell:{name:'Old Nell',look:{coat:'#8a857e',acc:'apron',hair:'#e8e0f0'},greet:'Mind the lines. I just did the lines.',topics:{job:{t:'Sweeper. Forty years of sand. I have swept up after every CHAMPION there ever was.'},champion:{t:'Vance leaves the sand clean. Vesper left it in furrows. The one before him, Ada Quill, left it wet, and I never did find out why. Whoever wins next, I will sweep it. That is the job.',xp:10},sand:{t:'Coliseum sand is Brinefen sand, cooked in the Cindermaw, sifted in Rimewatch, and blessed at Mossgate. Four cups in every grain. The League likes a symbol.'}}},
 bookie:{name:'Marco Fine',look:{coat:'#5a3d8a',acc:'cap',hair:'#1a1210',skin:'#9a6a48'},greet:'Odds on the crown: Apex, evens. Everybody else, the LONG shot.',topics:{job:{t:'I make the book on the crown. Legally. Mostly. The LONG shot pays well if anyone ever lands it.'},long:{t:'Three cups and I will believe you are a runner. Take the price of a bet on yourself; put it on yourself, and I will hold the slip.',need:'cups3',needNo:'You have not got three cups. Nobody bets on a handler with fewer than three cups. I have tried.',gold:150,once:'q_bookie',xp:15,t2:'The slip is in the drawer. Win, and I will tear it up with pleasure.'},apex:{t:'Evens, because she has won six years straight and still I would not lay shorter. Something about the way the Slagback looks at the crowd.'}}},
 hermit:{name:'Hermit Oak',look:{coat:'#4a6a4a',acc:'robe',hair:'#e8e0f0',skin:'#9a6a48'},greet:'You found it. Good. Sit. Do not sit there, that is a Gloomcap.',topics:{job:{t:'I keep the shrine the town forgot. The Elder still comes here, some springs. It likes AETHERCAPS, though it will not say so.'},aethercap:{t:'Two aethercaps on the middle totem and the grove will be kinder to you. Take these: the bees leave them for me, I have more than I can eat.',take:{aethercap:2},give:{honeydrop:3},giveEn:{bloom:4},once:'q_hermit',xp:15,t2:'The grove remembers. Go and see.',needNo:'Two aethercaps. Purple, from the plains. You will know them.'},elder:{t:'Fight it if you must. But leave a berry. It counts.'}}},
 steward:{name:'Steward Aurelio Crane',look:{coat:'#f2c14e',acc:'clip',hair:'#1a1210',tall:1},greet:'The Crown Coliseum. Entries are taken in championship week only.',topics:{job:{t:'I run the CHAMPIONSHIP. I also run the WALL, the catering, and the insurance.'},championship:{t:'Three rounds. Two rival companies, then the reigning champion, Aurelia Vance of Apex Biologic. It opens in the last seven days of the year. Four regional cups to ENTER. If you hold four and the week has not come, you may WAIT here as my guest.',xp:10},
  enter:{t:'Then let us see what you have built.',act:'cup:crown'},wait:{t:'The guest rooms are this way.',act:'waitweek'},wall:{t:'Behold. Dust it if you touch it.',act:'wall'}}},
 herald:{name:'Herald Pim',look:{coat:'#e0457b',acc:'hat'},greet:'Hear ye. Sorry. Habit.',topics:{job:{t:'I announce. I also explain the CALENDAR to people who arrive in the wrong week.'},calendar:{t:'The year is one hundred and twelve days, four seasons of twenty-eight. The championship takes the last seven. The date is in the corner of your ledger. If you miss it, there is always next year. There is always a next year.',xp:10},
  letter:{t:'Would you carry a LETTER to Imelda Foss at the League office? The Coliseum post has not run since the roof.',give:{letter:1},once:'q_letter1',xp:5,t2:'Has Foss answered? Bring me her REPLY.'},
  reply:{t:'A yes! The Coliseum gets its post back. Here, the fee, and a word on the record.',take:{reply:1},gold:80,giveRp:10,once:'q_letter3',xp:20,t2:'Post runs again. You did that.',needNo:'No reply yet? She is slow, but she answers.'}}}};

DB.events=[
 {id:'pedlar',w:4,who:{name:'Tamsin Crook, pedlar',look:{coat:'#8a5a2a',acc:'hat',hair:'#b0485a'}},text:'A pedlar with a cart of jars flags you down. "Tonics, handler? Salts? Everything fresh this week, or this month, anyway."',choices:[{label:'Two tonics (20 gold)',cost:{gold:20},items:{tonic:2},result:'She wraps them in newspaper.'},{label:'Smelling salts (35 gold)',cost:{gold:35},items:{salts:1},result:'"Do not sniff it yourself. People do."'}]},
 {id:'stray',w:3,who:{chimera:'@region'},text:'A stray chimera limps out of the grass, wary but too tired to run. It would be an easy snare.',choices:[{label:'Try to snare it',act:'stray'}]},
 {id:'purse',w:3,who:{scene:'purse'},text:'Somebody\'s purse lies in the road, dropped from a wagon. There is nobody in sight.',choices:[{label:'Keep it',gold:[15,45],result:'Finders keepers.'},{label:'Leave it at the next League post',rp:4,result:'A clerk will be pleased. Somebody will be very pleased.'}]},
 {id:'rival',w:3,who:'@rival',text:'A rival handler\'s wagon is drawn up at the crossroads. "Friendly match? Winner takes the loser\'s bounty."',choices:[{label:'Accept the match',act:'duel'}]},
 {id:'shed',w:3,who:{scene:'shed'},text:'Fresh shed skin, still warm, glittering with energy where it lies.',auto:{energy:{here:[2,4]}}},
 {id:'storm',w:2,who:{scene:'storm'},text:'A sudden squall. You shelter under the wagon for an hour and lose the light.',auto:{time:60}},
 {id:'scholar',w:2,who:{name:'Dr. Wyn Ashby, League survey',look:{coat:'#3f5a7a',acc:'clip',hair:'#8a857e'}},text:'A scholar with a satchel of forms asks you to describe the last well you drew from. She pays for good notes.',choices:[{label:'Describe it',rp:[4,8],gold:[10,20],time:30,result:'She writes it all down, twice.'}]},
 {id:'egg',w:1,who:{scene:'egg'},text:'An egg, alone in the grass, still warm. Whatever laid it is not coming back.',choices:[{label:'Take it',act:'egg'}]},
 {id:'thief',w:2,who:{chimera:'voltmite'},text:'A Voltmite darts out of the wagon with something in its mandibles and is gone before you can throw.',auto:{steal:1}},
 {id:'cook',w:3,who:{name:'Barnaby Stew, road cook',look:{coat:'#a0522d',acc:'apron',hair:'#e8e0f0'}},text:'A travelling cook stirs a pot on a tripod by the road. It smells of pepper and good intentions.',choices:[{label:'A hot meal for the team (15 gold)',cost:{gold:15},healAll:.3,result:'Everyone eats. Everyone feels better.'},{label:'Trade 2 grain for 2 Ember Jerky',cost:{items:{grain:2}},items:{jerky:2},result:'"Fair trade. Mind, it bites back."'}]},
 {id:'lostchild',w:2,time:'day',who:{name:'Wren, aged eight',look:{coat:'#e0457b',hair:'#f2c14e'}},text:'A child is calling into the grass for a Mossprout called Biscuit. "He always comes back. He always comes back."',choices:[{label:'Help look (an hour)',time:60,gold:25,rp:5,result:'You find Biscuit asleep under a hedge. Her mother presses coins on you and will not take them back.'}]},
 {id:'maud',w:2,who:{name:'Old Maud Kerry, retired handler',look:{coat:'#5a6e3a',acc:'scarf',hair:'#c9c9c9'}},text:'An old handler leans on a stick by the milestone. "Your lead stands wrong. I could fix that, for the price of a pie."',choices:[{label:'Pay for a lesson (30 gold)',cost:{gold:30},xpLead:.4,time:90,result:'She drills your lead until it stands right. It does look better.'}]},
 {id:'inspector',w:2,need:'licensed',who:{name:'Inspector Garrow, League',look:{coat:'#3f5a7a',acc:'cap',hair:'#1a1210'}},text:'A League inspector checks your licence, holds it up to the light, and hands it back. "In order. Take these; the League likes its handlers equipped."',auto:{items:{snare:2}}},
 {id:'bard',w:2,who:{name:'Lark Tully, balladeer',look:{coat:'#b38cf0',acc:'hat',hair:'#7a4a20'}},text:'A bard with a lute made from a Slagback shell is singing to nobody. "A song for the road? Five gold and you choose."',choices:[{label:'Tip for a song (5 gold)',cost:{gold:5},rp:6,lore:1}]},
 {id:'caravan',w:2,who:{name:'The Oslo brothers, traders',look:{coat:'#6b5313',acc:'hat',hair:'#1a1210'}},text:'A caravan of three wagons, painted with suns. "Imports, handler. Things you cannot get in town."',choices:[{label:'Aether Nut (30 gold)',cost:{gold:30},items:{zapnut:1}},{label:'Smelling salts (32 gold)',cost:{gold:32},items:{salts:1}},{label:'Mutagen vial (150 gold)',cost:{gold:150},items:{mutagen:1}}]},
 {id:'drover',w:2,who:{name:'A limping drover',look:{coat:'#7a5a32',acc:'hat',hair:'#4a3020'}},text:'A drover sits on a stone holding his ankle. His Slagback stands over him looking worried, as far as a Slagback can.',choices:[{label:'Give him a salve',cost:{items:{salve:1}},gold:50,rp:5,result:'He is on his feet in minutes and insists on paying.'},{label:'Give him a tonic',cost:{items:{tonic:1}},gold:30,rp:3,result:'It takes the edge off. He thanks you twice.'}]},
 {id:'oriel',w:2,who:{name:'Madame Oriel',look:{coat:'#5a3d8a',acc:'robe',hair:'#1a1210'}},text:'A fortune teller has set a table in the ditch. "Cross my palm, and I will tell you how your next fight goes."',choices:[{label:'Cross her palm (15 gold)',cost:{gold:15},fed:1,result:'"You will win it. Probably." Your team seems to believe her.'}]},
 {id:'smuggler',w:2,time:'night',who:{name:'A hooded figure',look:{coat:'#1f1b30',acc:'robe'}},text:'Someone steps out of the dark by the road with a case of vials. "Mutagen. Cheap. Nobody asks where from."',choices:[{label:'Buy one (70 gold)',cost:{gold:70},chance:.65,items:{mutagen:1},result:'The vial is real. You check twice.',fail:'It is coloured water. The figure is long gone.'}]},
 {id:'moth',w:2,who:{name:'Sister Moth, wandering enchanter',look:{coat:'#bfe6f2',acc:'robe',hair:'#e8e0f0'}},text:'A wandering enchanter is binding a charm into a fencepost. "The land here is generous. I could draw some off for you."',choices:[{label:'Pay her to draw it (20 gold)',cost:{gold:20},energy:{here:3},result:'She draws the energy up out of the ground and into your jars.'}]},
 {id:'poacher',w:2,who:{name:'Skell, a poacher',look:{coat:'#3a2e2c',acc:'hat',hair:'#1a1210'}},text:'A poacher with a cage on his back. Something inside is crying. "Not your business, handler. Unless you want to buy."',choices:[{label:'Free it (fight him)',act:'poacher'},{label:'Buy it (80 gold)',cost:{gold:80},act:'freed'}]},
 {id:'race',w:2,time:'day',who:{name:'Pip Fleet, racer',look:{coat:'#f2c14e',acc:'cap',hair:'#b0485a'}},text:'A boy with a very fast Frostlet. "Race you to the next milestone. Twenty gold says mine wins."',choices:[{label:'Race your lead (stake 20)',cost:{gold:20},act:'race'}]},
 {id:'soto',w:2,who:{name:'Dr. Imani Soto, field researcher',look:{coat:'#2f7a6a',acc:'goggles',hair:'#1a1210',skin:'#7a4a30'}},text:'A field researcher with calipers asks to measure your team. "For the Bestiary. You will be credited. Somewhere."',choices:[{label:'Let her measure them',rpTeam:3,time:30,result:'She measures everything, including you.'}]},
 {id:'wisp',w:2,time:'night',who:{scene:'wisp'},text:'Lights move in the grass beside the road, blue and slow, and they seem to want you to follow.',choices:[{label:'Follow the lights',act:'wisp'}]},
 {id:'nephew',w:3,region:['bloom'],who:{name:'Tam Brack, beekeeper\'s nephew',look:{coat:'#a08a55',acc:'hat',hair:'#7a4a20'}},text:'A young beekeeper carries a smoking pot down the road. "Uncle says to give these to handlers. He says you are the only ones the bees like."',auto:{items:{honeydrop:1}}},
 {id:'fisher',w:3,region:['tide'],who:{name:'Old Salt, fisherman',look:{coat:'#235c9c',acc:'cap',hair:'#e8e0f0'}},text:'An old fisherman is gutting cod on an upturned barrel. "Salt fish, dried this week. Your pups will thank you."',choices:[{label:'Two salt fish (20 gold)',cost:{gold:20},items:{saltfish:2}}]},
 {id:'miner',w:3,region:['ember'],who:{name:'A soot-faced miner',look:{coat:'#4a423f',acc:'helmet',hair:'#1a1210'}},text:'A miner coming off shift, black to the eyes. "Tonic? I would give a lot for a tonic. Peppers, say."',choices:[{label:'Trade a tonic for 3 ember peppers',cost:{items:{tonic:1}},items:{emberpepper:3}}]},
 {id:'pilgrim',w:3,region:['rime'],who:{name:'Pilgrim Ase',look:{coat:'#dfe9ee',acc:'robe',hair:'#c9c9c9'}},text:'A pilgrim on the way to the abbey, shaking with cold. "Could I share your fire? Only for a while."',choices:[{label:'Share your fire (half an hour)',time:30,items:{hardtack:2},result:'She warms her hands and leaves you her travelling biscuits.'}]}];
DB.lore=['a song about Ada Quill, the first champion, and the Voltmite she held at arm\'s length','a song about Gant Vesper\'s three cups and his fourth that got away','a song about the Hatch-Mother and the lighthouse that went dark','a song about the road north of the Roost that goes nowhere','a song about Apex Biologic, sung very quietly'];
/* rare chimera chains */
DB.chars.almond.topics.unlisted={t:'There is one thing in the Bestiary I have never drawn. A moth, big as your hand, pale, that drinks the lamps dry at night. Fenwick swears it is real. Ask him about the MOTH.',need:'q_almond',needNo:'Finish your five kinds first. Then we will talk about the ones nobody has.',set:'rq_lumi1',xp:10};
DB.chars.almond.topics.moth={t:'The moth is Fenwick\'s story. Fenwick Tallow, the lamplighter by the fountain. Ask him, not me; I only draw what I am shown.'};
DB.chars.almond.topics.kinds.t2='Your name is in the frontispiece. Second column, small print. Ask me about the UNLISTED one some time.';
DB.chars.tallow.topics.moth={t:'The lamp moth! Nobody believes me. It comes after dark and drinks the oil and leaves the glass cold. Three aethercaps and I will brew a bait oil it cannot resist, and then we set a TRAP.',need:'rq_lumi1',take:{aethercap:3},once:'rq_lumi2',xp:10,t2:'The bait oil is in the fountain lamp. Come back after dark and ask about the TRAP.',needNo:'Three aethercaps for the bait, and not before Prue has had her say.'};
DB.chars.tallow.topics.trap={t:'Look, there, on the fountain lamp. It came, it laid, and it went. That is an egg, handler, warm as a cup of tea. Take it before Prue sees it and wants to draw it.',need:'rq_lumi2',needNight:1,giveEgg:{sp:'lumivore',mut:'m_glow'},giveRp:10,once:'rq_lumi3',xp:25,t2:'The lamps burn true now. I almost miss it.',needNo:'It only comes after dark, and only to a baited lamp.'};
DB.chars.marrowbone.topics.last={t:'The last entry. I never wrote it; I could not. Something came up under the Marigold as she went over and carried me to the sand on its back. A serpent, gold on green, young. Ysolde reckons it is the Hatch-Mother\'s kin. Ask her about the SERPENT.',need:'q_shiplog',needNo:'My log is lost with my ship. What would I read you?',set:'rq_serp1',xp:10};
DB.chars.marrowbone.topics.serpent={t:'I only saw its back. Ysolde Wrack knows the deep water. Ask her.'};
DB.chars.marrowbone.topics.log.t2='I read it every night now. All but the LAST entry.';
DB.chars.diver.topics.serpent={t:'A wyrmling, gold on green? They nest under the Hatch-Mother, where it is warm. She would never let you near. Beat her, bring me two salt fish for the swim, and I will go down and look for the CLUTCH.',need:'rq_serp1',needNo:'Serpents? In the fen? Ask the captain; he tells that story when he has had a drink.',set:'rq_serp2',xp:10};
DB.chars.diver.topics.clutch={t:'Found it. One egg left in the clutch, under the old pearl bed. I think it has been waiting. Take it, and tell the captain.',need:['rq_serp2','alpha_hatchmother'],take:{saltfish:2},giveEgg:{sp:'tidewyrmling'},giveRp:12,once:'rq_serp3',xp:25,t2:'Did you tell him? Good.',needNo:'The Hatch-Mother first, then two salt fish, and then I dive.'};
DB.chars.pyre.topics.pits={t:'The pit champion, before the ban, was a lion with a mane of fire. They bred the line in seam glass: the kits grow inside the glass until it cracks. The last of them died with the pits. Unless somebody has found glass that beats. Ask Grit what is INSIDE his box.',need:'q_pyre',needNo:'Pay my price first. Then I tell stories.',set:'rq_cind1',xp:10};
DB.chars.pyre.topics.inside={t:'I do not know what is in his box. Grit Halloway does. Ask him.'};
DB.chars.pyre.topics.price.t2='Hit them first. Hit them hardest. The rest is paperwork. Ask me about the PITS some time.';
DB.chars.grit.topics.inside={t:'Inside? It cracked last night. I did not want to tell anybody. There is an egg in the box where the heart was, and it is too hot to hold, and it is purring. Take it. Please.',need:['q_glass','rq_cind1'],giveEgg:{sp:'cindermane',mut:'m_veins'},giveRp:12,once:'rq_cind2',xp:25,t2:'The box is empty and it still hums.',needNo:'The box? It is just a box. Why do you ask?'};
DB.chars.halvard.topics.call={t:'The first bell was not cast to call the Matriarch. It was cast to call her young. Take the abbey tuning rod and strike the old bell in the Frozen Chapel after dark. Something will come down out of the lights. Be ready with a snare; it will not stay.',need:'q_clapper',needNo:'Bring the first bell\'s clapper home before you ask me about bells.',give:{tuningrod:1},once:'rq_aur1',xp:15,t2:'Strike the chapel bell after dark, with the rod.'};
DB.chars.halvard.topics.clapper.t2='It rang at dawn. Did you hear? The whole town heard. Ask me what it was cast to CALL.';
DB.chars.pell.topics.capsule={t:'A dormant capsule. Pre-League. Oh, you beautiful thing. Six Aether, straight into the cell, and let us see. ... There. An egg. It grew the shell to hatch from. Put it in the incubator and do not tell the League.',take:{capsule:1},takeEn:{aether:6},giveEgg:{sp:'vaultling'},giveRp:15,once:'rq_vault',xp:25,t2:'I have been reading the capsule for a week. It has a serial number. It has a MANUFACTURER.',needNo:'A capsule? If you ever find one, bring it, and six Aether to wake it. The Gene Vault is where they would be.'};
DB.chars.pell.topics.manufacturer={t:'Apex. The serial prefix is Apex Biologic. Before the League. Make of that what you like.',need:'rq_vault',needNo:'What manufacturer?'};
DB.chars.pell.topics.parts.t+=' And if you ever have spare parts, I have a private STITCH project.';
DB.chars.pell.topics.stitch={t:'Three harvested parts: a Slagback\'s horn, a Brinepup\'s tail, a Voltmite\'s wing case. Native ones, not grafts. Harvest them and bring them in the bin. I have the rest. ... It is breathing. It is an egg, technically. Congratulations, you are a parent.',takeParts:{h_horn:1,t_fish:1,k_shell:1},giveEgg:{sp:'patchwork'},giveRp:12,once:'rq_patch',xp:25,t2:'It is doing well. Better than I did.',needNo:'I need a Slagback Horn, a Fish Tail from a Brinepup and a Voltmite\'s Wing Case in the parts bin. Harvest donors; the native parts come off whole.'};
DB.chars.hermit.topics.elder={t:'Fight it if you must. But leave a berry. It counts. And if you beat it fairly, come back and I will teach your cook the OFFERING.'};
DB.chars.hermit.topics.offering={t:'Two mossberries, a honey drop, an aethercap, baked in a leaf. Your cook knows how now; I have told the wind and the wind will tell her. Bring one here and I will call the grove\'s own DRAKE for you.',need:['q_hermit','alpha_grove'],needNo:'The grove has to know you first. Bring me aethercaps, and beat the Elder fairly.',set:'recipe_offering',xp:10};
DB.chars.hermit.topics.drake={t:'Give it here. ... Listen. There. It came down out of the canopy, took the offering, and left this in the leaves. The Elder\'s own line. Go carefully with it.',take:{offering:1},giveEgg:{sp:'bloomdrake',mut:'m_glow'},giveRp:12,once:'rq_drake',xp:25,t2:'The grove is quiet and full.',needNo:'An offering first. Your cook will know how, once I have taught it.'};
DB.chars.ingrith.topics.map.t='Five regions, four cups, three vaults, two lairs, one crown. And one road that does not go anywhere, north of the Roost. I drew it. I still do not know why. If you have been to the Roost, ask me about the ROAD.';
DB.chars.ingrith.topics.road={t:'East of the Roost, on the coast, a straight road runs into the snow and stops. There are tracks at the end of it that are there at dawn and gone by noon. Go at night, if you go. Take a snare. Take two.',need:'q_ingrith',needNo:'Survey the Roost for me first. Then we can talk about the places I have not drawn.',set:'clue_den',xp:10};
DB.chars.moss_inn.topics.rot={t:'The log has rot in the north wall. Two twists of salt in the wound and it dries. Bring salt and the honey drops in the cellar are yours.',take:{salt:2},give:{honeydrop:3},once:'q_hollow',xp:10,t2:'The wall is drying. You can hear it creak.',needNo:'Two twists of salt. The chandler in Saltmere, or Merrit.'};
DB.chars.moss_inn.topics.job.t+=' The log has ROT, if you are handy.';
DB.chars.cind_inn.topics.cellar={t:'The cellar goes down into the old workings. If you have been down the Deep Seam and come back, you are welcome to what is on the racks: the jerky the miners left.',need:'seen_deepseam',needNo:'Nobody goes in the cellar until they have been down the Seam. House rule. Ask Grit.',give:{jerky:4},once:'q_annie',xp:10,t2:'The racks are bare now. Good.'};
DB.chars.cind_inn.topics.job.t+=' There is a CELLAR, for those who have earned it.';
DB.chars.rime_shop.topics.cellar={t:'The ice cellar wants three bunches of frost mint hung in it to keep the smell down. Bring them and take hardtack for the road.',take:{frostmint:3},give:{hardtack:3},once:'q_kettil',xp:10,t2:'The cellar smells of mint now. Better.',needNo:'Three frost mint. I sell it, if you are lazy.'};
DB.chars.rime_shop.topics.job.t+=' The ice CELLAR needs seeing to.';
DB.chars.salt_shop.topics.count={t:'The League wants a count of what swims out there. Snare two kinds and describe them and I will give you salt fish from the good barrel.',needCaught:2,needNo:'Two kinds, snared. I will know if you are guessing.',give:{saltfish:3},giveRp:6,once:'q_pella',xp:10,t2:'The count is filed. Thank you.'};
DB.chars.salt_shop.topics.job.t+=' I also keep the fen COUNT for the League.';
DB.chars.nell.topics.salt={t:'The sand wants salting before the crown, two twists, or it dusts. Bring me salt and the steward\'s tip is yours.',take:{salt:2},gold:40,giveRp:5,once:'q_nell',xp:10,t2:'Salted. It will not dust.',needNo:'Two twists of salt. Any chandler.'};
DB.chars.nell.topics.job.t+=' I could use SALT for the sand.';

function openHelp(){openModal('<h2>How to play</h2><table><tr><td class="gold">Arrows / WASD</td><td>Walk. Walk into people to talk, into wells, bushes, nests, chests and signs to use them. Somebody in your way? Walk into them a second time to squeeze past.</td></tr><tr><td class="gold">E or Space</td><td>Use or talk to whatever you are facing. <span class="gold">L</span> looks at it.</td></tr><tr><td class="gold">C</td><td>Camp: your team and your crew. Train, splice, research, enchant, cook. Also Wait 1h and Rest till morning (sleeping rough heals less than an inn and can be interrupted).</td></tr><tr><td class="gold">W, J, Q</td><td>Wall of Awards, journal, save. Sleeping at an inn also saves.</td></tr><tr><td class="gold">In battle</td><td>Arrows or click to move, 1–4 to pick a move, arrows and Enter to aim, G guard, I use an item (tonics, salts, jerky, cooked throwables — costs the turn), S snare (wild only), F flee, A auto.</td></tr><tr><td class="gold">O</td><td>Settings: turn encounters, road events, dangerous nights, animations, previews, hover cards and music up, down or off.</td></tr><tr><td class="gold">F2</td><td>The backend: edit every registry of the game live, or reset it.</td></tr></table><h3>The battlefield</h3><p>Melee moves (reach 1) miss about one time in twenty; ranged moves one in ten, more at long range, against cover, or against a faster target. Ranged moves need a clear line — tall grass, rubble and pillars block them — and hit for 75% when used point-blank; a target standing in cover takes 30% less from ranged fire. Water costs two steps to enter unless you are Tide; Ember hits 20% weaker from water, Tide gets 10% more defence in it. Glowing elemental ground gives its own element +20% attack and costs everyone else 5% health per turn they start on it. Arenas hold a pool of the cup\'s element.</p><h3>Moves and damage</h3><p>Every move can be used a set number of times <b>in a row</b> (shown as 3×, 2×, 1× on its button) before it must rest; switching to another move, guarding or using an item resets the count. Ranged moves have a <b>passage</b> rule: Bloom and Aether pass through grass and rubble, Ember is stopped by water, Rime fizzles over Ember ground, and lobbed moves arc over everything. Every attack also has a <b>damage type</b> — slash, pierce, crush, shock, toxic or blast — separate from its element. Species, parts and mutations can resist a type (−25% each), be weak to it (+30% each), or boost it when attacking (+20% each). The camp sheet shows each chimera\'s profile; the target preview in battle tells you when you have found a weakness.</p><h3>The fallen</h3><p>A chimera that falls leaves remains of its element: a scorched ring, wilted leaves, a salt puddle, frost, or crystal shards. In battle its tile becomes that element\'s ground for the rest of the fight. On the map, the remains of what you beat stay where the fight happened.</p><h3>Fainted chimeras</h3><p>A chimera at 0 health is out until healed: a salve (60%), an inn (full), resting till morning in Camp (30%), or the cook\'s Trail Hash. Arena medics see to your team between cup rounds.</p><h3>The road and the night</h3><p>By day the League roads are safe: nothing will pick a fight with you while you are on one. Step off into the grass and it is fair game. After dark it changes. Different chimeras come out, off the road they come a quarter more often, two levels stronger, in bigger packs and stranger shapes, and they get the first move. Even the road is not quite safe at night. Things happen on the road too: pedlars, strays, dropped purses, and rival handlers who want a friendly match for a stake. Rivals win cups of their own across the year; the League board in your journal tracks them.</p><h3>Gold</h3><p>Wild battles pay a League bounty per chimera beaten. Cups pay well, chests and side quests pay once, and any shop buys forage and sundries at half price.</p><h3>The job</h3><p>Win the four regional cups in any order, then take the Championship at the Crown Coliseum in the last week of the year. The first three chimeras in your stable are your battle team. Each element beats two others: '+DB.elems.order.map(e=>elemDot(e)+' '+DB.elems.names[e]+' beats '+DB.elems.beats[e].map(x=>DB.elems.names[x]).join(' and ')).join('; ')+'.</p><div class="row"><span class="sp"></span><button data-a="closeModal" autofocus>Close</button></div>',false,'help')}

 /* characters, keywords, flags */
 const placed=new Set();for(const m of Object.values(MAPS))for(const n of m.npcs||[])placed.add(n.id);const setFlags=new Set(DB.engineFlags),needFlags=[];for(const L of DB.locs)if(L.alpha)setFlags.add('alpha_'+L.alpha);for(const m of Object.values(MAPS))if(Object.values(m.meta).some(x=>x.rare))setFlags.add('rare_'+m.id);for(const d of DB.dungeons){setFlags.add('alpha_'+d.alpha);setFlags.add('rare_'+d.id);setFlags.add('seen_'+d.id)}for(const L of DB.locs)setFlags.add('seen_'+L.id);for(const c in DB.chests)setFlags.add('chest_'+c);for(const s in DB.species)setFlags.add('caught_'+s);for(const s in DB.species)setFlags.add('caught_'+s);

 for(const ev of DB.events||[]){const effs=[ev.auto||{}].concat(ev.choices||[]);for(const e of effs){for(const k in e.items||{})chk(DB.items[k],'event '+ev.id+' gives unknown item '+k);for(const k in (e.cost||{}).items||{})chk(DB.items[k],'event '+ev.id+' costs unknown item '+k);chk(!e.act||['stray','duel','egg','poacher','freed','race','wisp'].includes(e.act),'event '+ev.id+' has unknown act '+e.act)}chk(ev.who,'event '+ev.id+' has nobody to show');if(ev.who&&ev.who.chimera&&ev.who.chimera!=='@region')chk(DB.species[ev.who.chimera],'event '+ev.id+' shows unknown species');if(ev.need)needFlags.push([ev.need,'event '+ev.id])}
