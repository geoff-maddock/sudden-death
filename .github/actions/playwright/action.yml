name: Playwright
description: Install the test tooling and Chromium, with the browser cached between runs
runs:
  using: composite
  steps:
    - name: Install the test tooling
      shell: bash
      run: |
        python -m pip install -r requirements-dev.txt
        echo "PW_VERSION=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_ENV"
    - name: Cache the browser
      id: pwcache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}
    - name: Install Chromium
      if: steps.pwcache.outputs.cache-hit != 'true'
      shell: bash
      run: python -m playwright install --with-deps chromium
    - name: Install Chromium's system libraries
      if: steps.pwcache.outputs.cache-hit == 'true'
      shell: bash
      run: python -m playwright install-deps chromium
