name: CI
# Pull requests only (a merge to main was already checked as its pull request), and not drafts: mark a PR ready for
# review when you want it checked. Docs-only changes don't run it. A new push to a PR cancels that PR's run in progress.
# The quick checks run on 4 shards side by side (issue #94): test/shard.py splits CHECKS by each check's time in CI
# (test/ci-times.txt), so each shard has about the same work, and each shard runs its part on its runner's cores. About
# 7 minutes a run, against 25 for one job. It uses about twice the runner minutes of one job (each job is counted by the
# minute, rounded up), which costs nothing while the repo is public. IF THE REPO GOES PRIVATE, go back to one job (set
# SHARDS to 1 and the matrix to [0]) to stay inside the free allowance. The build, the stale-file checks and the bot
# sanity run once, in their own job alongside. Run it by hand from the Actions tab (workflow_dispatch) to check main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # The quick checks, passed to test/all.sh (which runs several at a time, slowest first). A new check goes on the end.
  CHECKS: >-
    smoke seeded daily daily_board tipcheck tooltip fuzz handfit hooks traits sports pausesave practice season_goals profiles trouble forfeit
    realm_audit realm_tiles realm_smoke realm_match realm_save realm_party realm_road realm_town realm_dungeon
    realm_cups realm_bot realm_polish realm_feel realm_ground realm_ways realm_camp realm_stats realm_bonds
    realm_league realm_diamond_source realm_journal realm_diamond realm_diamond_ratings realm_diamond_nine
    realm_diamond_game realm_diamond_cup realm_diamond_feel realm_click realm_grounds realm_gmatch realm_cities
    realm_spots realm_fixtures realm_home realm_gfeel realm_notices realm_legs realm_captain realm_weather
    realm_name realm_tour realm_sinks realm_defend realm_legends realm_gate realm_settings realm_map soccer realm_soccer realm_retire indeck realm_eggs realm_prospects realm_engines realm_gridiron realm_gridiron_game realm_gridiron_play realm_gridiron_seven realm_gridiron_playbook realm_gridiron_world realm_gridiron_powers realm_gridiron_cup realm_gridiron_fixes realm_gridiron_feel realm_gridiron_view realm_gridiron_bench realm_gridiron_stance realm_music realm_ring realm_ring_hands realm_ring_card realm_ring_powers realm_ring_game realm_ring_cup realm_ring_feel realm_ring_tab realm_ring_tape realm_court realm_court_hands realm_court_five realm_court_calls realm_court_world realm_court_powers realm_court_kit realm_court_stars realm_court_cup realm_court_feel realm_court_cam realm_sportbar realm_sportpage realm_rink realm_rink_hands realm_rink_special realm_rink_six realm_rink_calls realm_rink_world realm_rink_powers realm_rink_kit realm_rink_stars realm_rink_kettle realm_rink_feel realm_figures realm_bracket realm_fans realm_fans_gate realm_fans_lift realm_fans_stand realm_fans_fame realm_stars realm_phoenix realm_kraken realm_behemoth realm_djinn realm_hydra realm_frostwyrm realm_adventure realm_adventure_charter realm_adventure_crew realm_adventure_fixed realm_daily realm_gear realm_ring_kit realm_grid_kit realm_ring_spirit realm_grid_powers2 realm_star_powers2 realm_places realm_links realm_links_nine realm_links_hands realm_links_four realm_links_call realm_links_world realm_links_powers realm_links_enchant realm_links_kit realm_links_stars realm_links_cup realm_links_feel realm_links_look realm_lanes realm_lanes_game realm_lanes_hands realm_lanes_five realm_lanes_call realm_lanes_world realm_lanes_powers realm_lanes_kit realm_lanes_stars realm_lanes_cup realm_lanes_feel realm_shed realm_shed_game realm_shed_hands realm_shed_four realm_shed_call realm_shed_world realm_shed_powers realm_shed_kit realm_shed_stars realm_shed_cup realm_shed_feel realm_shed_tilda realm_pets_rules realm_pets_battle realm_pets_own realm_pets_eggs realm_pets_shops realm_pets_bond realm_pets_ctx realm_pets_rivals realm_pets_feel realm_older_bugs realm_umbral_core realm_umbral_event realm_umbral_world realm_umbral_monsters realm_umbral_grounds realm_umbral_baseball realm_umbral_boxing realm_umbral_basketball realm_umbral_golf realm_umbral_hockey realm_umbral_finale realm_umbral_rewards realm_umbral_football realm_quickstart
jobs:
  build:
    name: Build, stale files and bot sanity
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: ./build.sh
      - name: Built file is up to date
        run: |
          git diff --exit-code dist/sudden-death.html || (echo "dist/sudden-death.html is stale: run ./build.sh and commit it" && exit 1)
      - name: Realm built file is up to date
        run: |
          ./build.sh src/realm/manifest.txt && (git diff --exit-code dist/realm.html || (echo "dist/realm.html is stale: run ./build.sh src/realm/manifest.txt and commit it" && exit 1))
      - uses: ./.github/actions/playwright
      - name: Bot sanity (no errors or stalls in 30 runs)
        run: python test/lab.py 30 | tee lab.txt && grep -q "run errors 0" lab.txt && grep -q "stalls 0" lab.txt

  checks:
    name: Quick checks (shard ${{ matrix.shard }} of 4)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # a stuck run stops here rather than burning minutes until GitHub's six-hour limit
    timeout-minutes: 25
    strategy:
      # every shard runs to the end, so one run shows every failure
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/playwright
      - name: Quick checks, this shard's part
        # one check per core at a time; the shard's checks from test/shard.py (its time on stderr, in the log)
        run: |
          MINE=$(python test/shard.py ${{ matrix.shard }} $SHARDS $CHECKS)
          # (all.sh starts the slowest first, from its times file: seed it with CI's own times)
          mkdir -p build && cp test/ci-times.txt build/test-times.txt
          JOBS=$(nproc) ./test/all.sh $MINE
      - name: Logs of the failed checks
        if: failure()
        run: |
          for s in build/test-status/*; do
            t=$(basename "$s"); read -r code _ < "$s"
            [ "$code" = 0 ] || { echo "::group::$t (exit $code)"; cat "/tmp/sd-$t.log"; echo "::endgroup::"; }
          done
