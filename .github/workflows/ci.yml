name: CI
# Pull requests only (a merge to main was already checked as its pull request), and not drafts: mark a PR ready for
# review when you want it checked. Docs-only changes don't run it. A new push to a PR cancels that PR's run in progress.
# It's one job: test/all.sh runs the checks side by side on the runner's cores, which uses about half the runner minutes
# of splitting them across shards (each job is counted by the minute, rounded up). Actions minutes are free while the
# repo is public; if it ever goes private again, that's what keeps it inside the free allowance. Run it by hand from
# the Actions tab (workflow_dispatch) when you want to check main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # The quick checks, passed to test/all.sh (which runs several at a time, slowest first). A new check goes on the end.
  CHECKS: >-
    smoke tipcheck tooltip fuzz handfit hooks traits sports pausesave practice season_goals profiles trouble forfeit
    realm_audit realm_tiles realm_smoke realm_match realm_save realm_party realm_road realm_town realm_dungeon
    realm_cups realm_bot realm_polish realm_feel realm_ground realm_ways realm_camp realm_stats realm_bonds
    realm_league realm_diamond_source realm_journal realm_diamond realm_diamond_ratings realm_diamond_nine
    realm_diamond_game realm_diamond_cup realm_diamond_feel realm_click realm_grounds realm_gmatch realm_cities
    realm_spots realm_fixtures realm_home realm_gfeel realm_notices realm_legs realm_captain realm_weather
    realm_name realm_tour realm_sinks realm_defend realm_legends realm_gate realm_settings realm_map soccer realm_soccer realm_retire indeck realm_eggs realm_prospects realm_engines realm_gridiron realm_gridiron_game realm_gridiron_play realm_gridiron_seven realm_gridiron_playbook realm_gridiron_world realm_gridiron_powers realm_gridiron_cup realm_gridiron_fixes realm_gridiron_feel realm_gridiron_view realm_gridiron_bench realm_gridiron_stance realm_music realm_ring realm_ring_hands realm_ring_card realm_ring_powers realm_ring_game realm_ring_cup realm_ring_feel realm_ring_tab realm_stars realm_phoenix realm_kraken realm_behemoth realm_djinn realm_hydra realm_frostwyrm realm_adventure realm_adventure_charter realm_adventure_crew
jobs:
  ci:
    name: Build, stale files, bot sanity and quick checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # a stuck run stops here rather than burning minutes until GitHub's six-hour limit
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: ./build.sh
      - name: Built file is up to date
        run: |
          git diff --exit-code dist/sudden-death.html || (echo "dist/sudden-death.html is stale: run ./build.sh and commit it" && exit 1)
      - name: Realm built file is up to date
        run: |
          ./build.sh src/realm/manifest.txt && (git diff --exit-code dist/realm.html || (echo "dist/realm.html is stale: run ./build.sh src/realm/manifest.txt and commit it" && exit 1))
      - uses: ./.github/actions/playwright
      - name: Bot sanity (no errors or stalls in 30 runs)
        run: python test/lab.py 30 | tee lab.txt && grep -q "run errors 0" lab.txt && grep -q "stalls 0" lab.txt
      - name: Quick checks
        # one check per core at a time
        run: JOBS=$(nproc) ./test/all.sh $CHECKS
      - name: Logs of the failed checks
        if: failure()
        run: |
          for s in build/test-status/*; do
            t=$(basename "$s"); read -r code _ < "$s"
            [ "$code" = 0 ] || { echo "::group::$t (exit $code)"; cat "/tmp/sd-$t.log"; echo "::endgroup::"; }
          done
